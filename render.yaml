# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — Akihabara TCG Warehouse
#
# One-command deployment: in the Render Dashboard choose
#   New → Blueprint → select this repository
# Render reads this file, creates the service, builds and deploys it.
# Every future `git push` to `main` redeploys automatically.
#
# Hosting model: Web Service (Node). The site needs its /api routes
# (checkout, orders, auth, admin data) to run server-side, so a plain
# Node web service is required — NOT a static site.
#
#   Build:  npm install && npm run build
#     → next build (output: "standalone") + scripts/postbuild.mjs stages
#       static & public assets next to the standalone server (works for
#       both flat and nested standalone layouts).
#   Start:  npm start
#     → scripts/start-server.mjs launches the standalone server bound to
#       0.0.0.0 (Render's HOSTNAME quirk) on Render's PORT env var.
#
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: akihabara-tcg-warehouse
    runtime: node

    # Deterministic install from package-lock.json, then the standalone build.
    # (When creating the service manually in the Render dashboard instead of
    # via this blueprint, use the same two commands.)
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start

    # Keep every push to main deploying automatically.
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    envVars:
      - key: NODE_VERSION
        value: "24"

    headers:
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
