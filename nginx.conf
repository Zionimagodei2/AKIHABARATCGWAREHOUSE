# Akihabara TCG Warehouse — nginx serving config (Coolify/Docker image)
# Restores the edge policy the site had on Render (see render.yaml):
# gzip on text payloads, 1-year immutable caching for content-hashed
# assets, short caching for sitemap/robots, baseline security headers.

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/html application/json application/javascript text/javascript application/xml text/xml image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets never change under the same URL.
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ =404;
    }
}
